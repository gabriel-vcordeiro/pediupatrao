<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">
                <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
            </h2>
            <p class="text-muted small mb-0">Consulta e gestão cadastral de clientes</p>
        </div>
        <!-- Botão Novo Cliente: visível apenas para ATENDENTE e GERENTE (invisível para ADMIN) -->
        <a href="/clientes/novo" class="btn btn-primary" sec:authorize="hasAnyRole('ATENDENTE', 'GERENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela de clientes -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th class="text-end pe-4" sec:authorize="hasAnyRole('ATENDENTE', 'GERENTE', 'ADMIN')">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientes-tabela">
                    <!-- Linhas carregadas pelo servidor via Thymeleaf -->
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum cliente cadastrado.
                        </td>
                    </tr>
                    <tr th:each="cliente : ${clientes}">
                        <td class="ps-3 fw-medium" th:text="${cliente.nome != null ? cliente.nome : '—'}"></td>
                        <td th:text="${cliente.telefone != null ? cliente.telefone : '—'}"></td>
                        <td>
                            <span th:text="${cliente.logradouro != null ? (cliente.logradouro + (cliente.numero != null ? ', ' + cliente.numero : '') + (cliente.bairro != null ? ' - ' + cliente.bairro : '') + (cliente.cidade != null ? ', ' + cliente.cidade : '')) : (cliente.endereco != null ? cliente.endereco : '—')}"></span>
                        </td>
                        <td class="text-end pe-4">
                            <!-- Editar: visível apenas para ATENDENTE e GERENTE -->
                            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}"
                               class="btn btn-sm btn-outline-primary me-1"
                               sec:authorize="hasAnyRole('ATENDENTE', 'GERENTE')">
                                <i class="bi bi-pencil-fill"></i> Editar
                            </a>
                            <!-- Excluir: visível apenas para ADMIN e GERENTE (invisível para ATENDENTE) -->
                            <button class="btn btn-sm btn-outline-danger"
                                    th:data-id="${cliente.id}"
                                    onclick="excluirCliente(this.getAttribute('data-id'))"
                                    sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
                                <i class="bi bi-trash-fill"></i> Excluir
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(clientes)}">
            Total: <strong th:text="${#lists.size(clientes)}"></strong> cliente(s)
        </div>
    </div>

    <!-- Flags de permissão injetadas pelo Spring Security para scripts client-side -->
    <div id="authFlags" style="display:none;"
         th:data-pode-editar="${#authorization.expression('hasAnyRole(''ATENDENTE'', ''GERENTE'')')}"
         th:data-pode-excluir="${#authorization.expression('hasAnyRole(''ADMIN'', ''GERENTE'')')}">
    </div>

    <script>
        const API_URL = '/api/clientes';
        const tabelaClientes = document.getElementById('clientes-tabela');
        const authEl = document.getElementById('authFlags');
        const podeEditar = authEl ? authEl.dataset.podeEditar === 'true' : false;
        const podeExcluir = authEl ? authEl.dataset.podeExcluir === 'true' : false;

        async function excluirCliente(id) {
            if (confirm('Tem certeza que deseja excluir este cliente?')) {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Erro ao excluir o cliente: você não possui permissão.');
                }
            }
        }
    </script>
</div>
</body>
</html>
