<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Gestão de Produtos</title>
</head>
<body>

<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">
                <i class="bi bi-boxes me-2 text-primary"></i>Produtos & Cardápio
            </h2>
            <p class="text-muted small mb-0">Gerenciamento de produtos, categorias e preços</p>
        </div>

        <!-- Botão Novo Produto: visível apenas para ADMIN e GERENTE -->
        <button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#formularioProduto"
                sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </button>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Formulário de Cadastro (visível apenas para ADMIN e GERENTE) -->
    <div class="collapse mb-4" id="formularioProduto" sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0"><i class="bi bi-plus-circle me-2"></i>Cadastrar Produto</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/produtos/salvar}" method="post" id="produtoForm">
                    <div class="row">
                        <div class="col-md-5 mb-3">
                            <label for="nome" class="form-label fw-medium">Nome do Produto</label>
                            <input type="text" id="nome" name="nome" class="form-control" placeholder="Ex: Pizza Calabresa" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="tipo" class="form-label fw-medium">Tipo</label>
                            <select id="tipo" name="tipo" class="form-select" required>
                                <option value="" disabled selected>Selecione o Tipo</option>
                                <option value="Pizza">Pizza</option>
                                <option value="Lanche">Lanche</option>
                                <option value="Bebida">Bebida</option>
                                <option value="Porção">Porção</option>
                                <option value="Adicional">Adicional</option>
                            </select>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="preco" class="form-label fw-medium">Preço (R$)</label>
                            <input type="number" id="preco" name="preco" class="form-control" placeholder="0.00" step="0.50" min="0" required>
                        </div>
                        <div class="col-md-2 mb-3 d-flex align-items-center pt-4">
                            <div class="form-check">
                                <input type="checkbox" id="ativo" name="ativo" class="form-check-input" checked>
                                <label for="ativo" class="form-check-label fw-medium">Ativo</label>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-secondary" data-bs-toggle="collapse" data-bs-target="#formularioProduto">Cancelar</button>
                        <button type="submit" class="btn btn-success"><i class="bi bi-check-lg me-1"></i>Salvar Produto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Tabela de Produtos -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Status</th>
                        <th class="text-end pe-4" sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum produto cadastrado.
                        </td>
                    </tr>
                    <tr th:each="produto : ${produtos}">
                        <td class="ps-3 text-muted small" th:text="${produto.id}"></td>
                        <td class="fw-medium" th:text="${produto.nome != null ? produto.nome : '—'}"></td>
                        <td>
                            <span class="badge bg-secondary" th:text="${produto.tipo != null ? produto.tipo : 'Geral'}"></span>
                        </td>
                        <td class="fw-bold text-primary">
                            R$ <span th:text="${produto.preco != null ? #numbers.formatDecimal(produto.preco, 1, 'COMMA', 2, 'POINT') : '0,00'}"></span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${produto.ativo != null and produto.ativo} ? 'bg-success' : 'bg-danger'"
                                  th:text="${produto.ativo != null and produto.ativo} ? 'Ativo' : 'Inativo'">
                            </span>
                        </td>
                        <td class="text-end pe-4" sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
                            <button class="btn btn-sm btn-outline-danger"
                                    th:data-id="${produto.id}"
                                    onclick="excluirProduto(this.getAttribute('data-id'))">
                                <i class="bi bi-trash-fill"></i> Excluir
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(produtos)}">
            Total: <strong th:text="${#lists.size(produtos)}"></strong> produto(s)
        </div>
    </div>

    <script>
        async function excluirProduto(id) {
            if (confirm('Tem certeza que deseja excluir este produto?')) {
                const response = await fetch('/api/produtos/' + id, { method: 'DELETE' });
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Erro ao excluir produto: você não possui permissão.');
                }
            }
        }
    </script>
</div>

</body>
</html>
