<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body>
        <div th:fragment="sidebar">
            <div id="sidebar">
                <div class="px-3 py-3 border-bottom border-secondary border-opacity-25 text-center">
                    <h4 class="fw-bold mb-1 text-primary">Pediu Patrão</h4>
                    <span class="badge bg-dark border text-white small">Pizzaria & Delivery</span>
                </div>

                <!-- Identificação do Usuário e Perfil Conectado -->
                <div class="px-3 py-2 my-2 bg-dark bg-opacity-25 rounded mx-2" sec:authorize="isAuthenticated()">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-person-circle fs-4 text-primary"></i>
                        <div class="overflow-hidden">
                            <strong class="d-block text-truncate small" sec:authentication="name"></strong>
                            <!-- Badge com cor correspondente ao perfil -->
                            <span sec:authorize="hasRole('ADMIN')" class="badge bg-danger" style="font-size: 0.7rem;">ADMIN</span>
                            <span sec:authorize="hasRole('GERENTE')" class="badge bg-primary" style="font-size: 0.7rem;">GERENTE</span>
                            <span sec:authorize="hasRole('ATENDENTE')" class="badge bg-secondary" style="font-size: 0.7rem;">ATENDENTE</span>
                        </div>
                    </div>
                </div>

                <ul class="nav flex-column mt-2">
                    <!-- 1. Home: Visível para todos os perfis -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" aria-current="page">
                            <i class="bi bi-house"></i><span class="d-none d-md-inline">&nbsp;Home</span>
                        </a>
                    </li>

                    <!-- 2. Clientes: Visível apenas para GERENTE e ATENDENTE (oculto para ADMIN) -->
                    <li class="nav-item" sec:authorize="hasAnyRole('GERENTE', 'ATENDENTE')">
                        <a class="nav-link" th:href="@{/clientes}">
                            <i class="bi bi-person-raised-hand"></i><span class="d-none d-md-inline">&nbsp;Clientes</span>
                        </a>
                    </li>

                    <!-- 3. Pedidos: Visível para todos (ADMIN consulta, GERENTE gerencia, ATENDENTE registra) -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/pedidos}">
                            <i class="bi bi-bag"></i><span class="d-none d-md-inline">&nbsp;Pedidos</span>
                        </a>
                    </li>

                    <!-- 4. Auditoria: Visível EXCLUSIVAMENTE para ADMIN e GERENTE (oculto para ATENDENTE) -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
                        <a class="nav-link text-warning" th:href="@{/auditoria}">
                            <i class="bi bi-shield-check"></i><span class="d-none d-md-inline">&nbsp;Auditoria</span>
                        </a>
                    </li>

                    <!-- 5. Configurações: Visível apenas para ADMIN e GERENTE (oculto para ATENDENTE) -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
                        <a class="nav-link" href="#" onclick="toggleSubmenu(event, this)">
                            <i class="bi bi-gear"></i><span class="d-none d-md-inline">&nbsp;Configurações</span>
                            <span class="float-end">&#9662;</span>
                        </a>
                        <ul class="nav flex-column submenu">
                            <!-- Produtos: Visível para ADMIN e GERENTE -->
                            <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
                                <a class="nav-link" th:href="@{/produtos}">
                                    <i class="bi bi-boxes"></i><span class="d-none d-md-inline">&nbsp;Produtos</span>
                                </a>
                            </li>

                            <!-- Usuários: Visível EXCLUSIVAMENTE para ADMIN (oculto para GERENTE e ATENDENTE) -->
                            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                                <a class="nav-link" th:href="@{/usuarios}">
                                    <i class="bi bi-people-fill"></i><span class="d-none d-md-inline">&nbsp;Usuários</span>
                                </a>
                            </li>
                        </ul>
                    </li>

                    <!-- 6. Botão Sair / Logout -->
                    <li class="nav-item mt-3 pt-2 border-top border-secondary border-opacity-25">
                        <form th:action="@{/logout}" method="post" class="px-3">
                            <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                                <i class="bi bi-box-arrow-right me-1"></i>Sair
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </body>
</html>
